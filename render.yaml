# Free-tier setup: $0/mo on Render, with real tradeoffs (see the README's
# "Deploying to Render" section) - the free Postgres wipes all data after 30
# days, and the free Web Service sleeps after 15 min idle unless something
# pings it. To upgrade to an always-on paid setup later, change the service's
# `type` to `worker` and `plan` to `starter`, and the database's `plan` to
# something like `basic-256mb` (a worker needs no healthCheckPath/PORT).
databases:
  - name: ksapai-support-db
    plan: free
    databaseName: ksapai_support
    user: ksapai

services:
  - type: web
    name: ksapai-desktop-support-bot
    runtime: python
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OLLAMA_API_HOST
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        value: gemma4:31b-cloud
      - key: HISTORY_LIMIT
        value: "20"
      - key: POSTGRES_DSN
        fromDatabase:
          name: ksapai-support-db
          property: connectionString
